<style>
:root {
  --bg: #07090e;
  --card-bg: rgba(22, 26, 38, 0.65);
  --card-border: rgba(255, 255, 255, 0.12);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #6366f1;
  --accent-glow: rgba(99, 102, 241, 0.35);
  --radius-lg: 24px;
  --radius-md: 14px;
  --blur: blur(20px) saturate(180%);
  --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

body.light {
  --bg: #f1f5f9;
  --card-bg: rgba(255, 255, 255, 0.7);
  --card-border: rgba(255, 255, 255, 0.8);
  --text-main: #0f172a;
  --text-muted: #64748b;

}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: var(--transition);
  overflow-x: hidden;
  position: relative;
}

/* Ambient Glow */
.glow-orb {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 0;
  filter: blur(50px);
}

/* Lightweight motion system */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes softPulse {
  0%, 100% { opacity: .55; }
  50% { opacity: .8; }
}
@keyframes playerIn {
  from { opacity: 0; transform: scale(.985); }
  to { opacity: 1; transform: scale(1); }
}

header { animation: fadeUp .42s ease-out both; }
.search-card { animation: fadeUp .48s .04s ease-out both; }
.player-container { animation: playerIn .5s .08s ease-out both; }
.glow-orb { animation: softPulse 7s ease-in-out infinite; }

.btn-glass, .btn-primary { will-change: transform; }
.btn-glass:hover { transition-duration: .22s; }
.btn-primary:hover { transition-duration: .22s; }
.player-container:hover { box-shadow: 0 28px 58px -16px rgba(0,0,0,.56); }

/* Keep focus/fullscreen transitions smooth but cheap */
body.focus-mode main { animation: fadeUp .28s ease-out both; }
.player-container:fullscreen { animation: playerIn .22s ease-out both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Header */
header {
  height: 70px;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1050px;
  width: 100%;
  margin: 0 auto;
  z-index: 2;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.5px;
  text-decoration: none;
  color: var(--text-main);
  transition: var(--transition);
}

.brand:hover {
  transform: translateY(-1px);
  opacity: 0.9;
}

/* Custom Unique Logo */
.brand-icon {

}

.brand-icon::after {

  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
}

.brand-icon svg { width: 20px; height: 20px; fill: currentColor; z-index: 1; }

.header-actions { display: flex; gap: 8px; }

/* iOS Glass Button */
.btn-glass {
  background: var(--card-bg);

  border: 1px solid var(--card-border);
  color: var(--text-main);

  border-radius: 30px;

.btn-glass:hover {

.btn-glass:active { transform: scale(0.96); }

}

main {

}

/* Search Box */
.search-card {

}

.search-card input {

  outline: none;
  padding: 0 18px;
  color: var(--text-main);
  font-size: 15px;
}

.search-card input::placeholder { color: var(--text-muted); }

.btn-primary {
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  padding: 0 22px;
  height: 46px;
  font-size: 14px;
  font-weight: 600;

}

.btn-primary:hover {

}

/* Glass Player Frame */
.player-container {
  background: var(--card-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  transition: var(--transition);
}

.player-aspect {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
}

.player-aspect iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  gap: 12px;
}

.empty-state svg { width: 52px; height: 52px; opacity: 0.35; fill: currentColor; }


/* Lightweight playback-speed control layered above YouTube's native controls. */
.player-speed {
  position:absolute;
  left:50%;
  bottom:54px;
  transform:translate(-50%, 8px);
  z-index:20;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .18s ease, transform .18s ease, visibility .18s ease;
}
.player-aspect.speed-ui-visible .player-speed,
.player-speed:hover,
.player-speed.speed-open {
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translate(-50%, 0);
}
.player-speed-toggle {
  border:1px solid rgba(255,255,255,.18);
  background:rgba(18,18,22,.88);
  color:#fff;
  border-radius:8px;
  padding:7px 10px;
  font:600 12px system-ui,sans-serif;
  cursor:pointer;
  box-shadow:0 5px 18px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
}
.player-speed-toggle:hover { background:rgba(35,35,40,.94); }
.player-speed-menu {
  position:absolute;
  left:50%;
  bottom:calc(100% + 6px);
  transform:translateX(-50%);
  display:none;
  gap:3px;
  padding:4px;
  border-radius:9px;
  background:rgba(18,18,22,.94);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  white-space:nowrap;
}
.player-speed.speed-open .player-speed-menu { display:flex; }
.player-speed-option {
  border:0;
  background:transparent;
  color:rgba(255,255,255,.76);
  border-radius:6px;
  padding:6px 8px;
  font:600 11px system-ui,sans-serif;
  cursor:pointer;
}
.player-speed-option:hover { color:#fff; background:rgba(255,255,255,.12); }
.player-speed-option.active { color:#fff; background:var(--accent); }
.player-container:fullscreen .player-speed { bottom:62px; }
@media (max-width:600px) {
  .player-speed { bottom:48px; }
  .player-container:fullscreen .player-speed { bottom:56px; }
}

/* Action Toolbar */
.toolbar {
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--card-border);
  flex-wrap: wrap;
}

.btn-action {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;

}

.btn-action:hover {

}

.btn-action.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 4px 12px var(--accent-glow);
}

.btn-action svg { width: 14px; height: 14px; fill: currentColor; }

.select-action {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--card-border);
  color: var(--text-main);

  font-weight: 500;

.select-action option {

}

.select-action:hover {

}

.status-badge {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-muted);
}


/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: var(--card-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 13px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: var(--transition);
  z-index: 999;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

footer {
  text-align: center;
  padding: 24px;
  font-size: 12px;
  color: var(--text-muted);
}

/* Browser fullscreen */
.player-container:fullscreen {
  border-radius: 0;
  border: none;
  width: 100vw;
  height: 100vh;
}

.player-container:fullscreen .toolbar { display: none; }
.player-container:fullscreen .player-aspect {
  width: 100%;
  height: 100vh;
  aspect-ratio: auto;
}

/* Focus Mode: hide the site UI without using the browser Fullscreen API. */
body.focus-mode {
  background: #000;
  overflow: hidden;
}

body.focus-mode .glow-orb,
body.focus-mode header,
body.focus-mode .seo-intro,
body.focus-mode .search-card,

  width: 100%;

  border-left: 0;

.focus-exit-btn {

@media (max-width: 600px) { .focus-exit-btn { top: 10px; right: 10px; padding: 9px 10px; } .focus-exit-btn { font-size: 0; } }
@media (prefers-reduced-motion: reduce) { .focus-exit-btn { animation: none !important; } }

.userscript-modal { display:none; position:fixed; inset:0; z-index:10000; align-items:center; justify-content:center; padding:20px; }

.userscript-dialog { position:relative; width:min(900px,100%); max-height:min(88vh,760px); display:flex; flex-direction:column; gap:16px; padding:22px; border:1px solid rgba(255,255,255,.12); border-radius:18px; background:var(--card-bg, #151519); box-shadow:0 24px 80px rgba(0,0,0,.45); }
.userscript-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }

.userscript-actions { display:flex; justify-content:flex-end; gap:10px; }
@keyframes modalIn { from { opacity:0; transform:scale(.985); } to { opacity:1; transform:scale(1); } }

/* Keep the PC display awake while a video is playing. */
body.playing-video {
  /* JS Wake Lock API handles supported browsers; this class is a state marker. */
}

/* Light ISO-inspired visual polish */
:root { --iso-line: rgba(148,163,184,.16); --iso-shadow: 0 18px 45px rgba(0,0,0,.20); }

          <button class="player-speed-option" type="button" data-speed="1.25">1.25x</button>
          <button class="player-speed-option" type="button" data-speed="1.5">1.5x</button>
          <button class="player-speed-option" type="button" data-speed="1.75">1.75x</button>
          <button class="player-speed-option" type="button" data-speed="2">2x</button>
        </div>
      </div>
      <iframe id="videoIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display:none;"></iframe>
    </div>

    <div class="toolbar">
      <button class="btn-action" id="loopBtn">
        <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        Loop

        <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        YouTube
      </button>
      <button class="btn-action" id="copyCleanBtn">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        Copy Link
      </button>
      <button class="btn-action" id="copyTimeBtn">
        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        Copy Link + Time

      <button class="btn-action" id="focusBtn" title="Focus Mode (F)">
        <svg viewBox="0 0 24 24"><path d="M7 3H3v4h2V5h2V3zm12 0h-4v2h2v2h2V3zM5 17H3v4h4v-2H5v-2zm14 0h-2v2h-2v2h4v-4zM8 8h8v8H8z"/></svg>

        Fullscreen

      <span class="status-badge" id="statusBadge">Ready</span>

</main>

<button id="focusExitBtn" class="focus-exit-btn" type="button" title="Exit Focus Mode">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v2H7v3H5V5zm14 0v5h-2V7h-3V5h5zM5 14h2v3h3v2H5v-5zm14 0v5h-5v-2h3v-3h2z"/></svg>
  Exit Focus
</button>

<div class="userscript-modal" id="userscriptModal" aria-hidden="true">
  <div class="userscript-backdrop" id="userscriptBackdrop"></div>
  <section class="userscript-dialog" role="dialog" aria-modal="true" aria-labelledby="userscriptTitle">
    <div class="userscript-head">
      <div>
        <div class="userscript-kicker">FORCUSEDYT</div>
        <h2 id="userscriptTitle">YouTube Auto-Redirect</h2>
        <p>Copy this Tampermonkey userscript to automatically send YouTube video links to ForcusedYT.</p>
      </div>
      <button class="userscript-close" id="userscriptClose" type="button" aria-label="Close">×</button>
    </div>
    <textarea id="userscriptCode" class="userscript-code" readonly spellcheck="false"></textarea>
    <div class="userscript-actions">
      <button class="btn-action" id="userscriptCopy" type="button">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14h13c1.1 0 2-.9 2-2V7c0-1.1.9-2 2-2zm0 16H8V7h11v14z"/></svg>
        Copy Userscript
      </button>
      <button class="btn-action" id="userscriptDone" type="button">Done</button>
    </div>

</div>

<footer>ForcusedYT — Distraction-Free Experience</footer>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

let displayWakeLock = null;
async function requestDisplayWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    if (!displayWakeLock) displayWakeLock = await navigator.wakeLock.request('screen');
    displayWakeLock.addEventListener('release', () => { displayWakeLock = null; });
  } catch (_) {}
}
async function releaseDisplayWakeLock() {
  if (displayWakeLock) { try { await displayWakeLock.release(); } catch (_) {} displayWakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentVideoId) requestDisplayWakeLock();
});


let isLooping = false;
let currentVideoId = '';
let currentTimestamp = null;

// ForcusedYT deep-link support.
// Canonical share/reload URL: https://forcused.github.io/yt/?v=VIDEO_ID
// Also accepts pasted site links such as:
// https://forcused.github.io/yt/VIDEO_ID
function getDeepLinkData() {
  const params = new URLSearchParams(location.search);
  let id = params.get('v') || '';

  // Also understand /yt/VIDEO_ID if reached through a GitHub Pages fallback.
  if (!id) {
    const match = location.pathname.match(/^\/yt\/([A-Za-z0-9_-]{11})\/?$/);
    if (match) id = match[1];
  }

  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return null;

  const start = parseTimestamp(params.get('t') || params.get('start'));
  return { id, start };
}

function updateCanonicalUrl(id, start = null, replace = true) {
  // Always use index.html's query URL so refreshing on GitHub Pages never 404s.
  const url = new URL('/yt/', location.origin);
  url.searchParams.set('v', id);
  if (start) url.searchParams.set('t', start);
  (replace ? history.replaceState : history.pushState).call(history, {}, '', url.href);
}



function parseTimestamp(t) {
  if (!t) return null;
  if (/^\d+$/.test(t)) return parseInt(t, 10);
  let seconds = 0;
  const h = t.match(/(\d+)h/); const m = t.match(/(\d+)m/); const s = t.match(/(\d+)s/);
  if (h) seconds += parseInt(h[1], 10) * 3600;
  if (m) seconds += parseInt(m[1], 10) * 60;
  if (s) seconds += parseInt(s[1], 10);
  return seconds > 0 ? seconds : null;
}

function extractYouTubeData(value) {
  value = value.trim();
  if (!value) return null;
  if (/^[a-zA-Z0-9_-]{11}$/.test(value)) return { id: value, start: null };

  let id = null; let start = null;
  try {
    const u = new URL(value);
    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    const tParam = u.searchParams.get('t') || u.searchParams.get('start');
    start = parseTimestamp(tParam);

    if (host === 'youtu.be') {
      id = u.pathname.split('/').filter(Boolean)[0];
    } else if (host === 'youtube.com' || host === 'm.youtube.com') {
      if (u.pathname === '/watch') { id = u.searchParams.get('v'); }
      else {
        const paths = u.pathname.split('/');
        if (['/shorts/', '/embed/', '/live/', '/v/'].some(p => u.pathname.startsWith(p))) { id = paths[2]; }
      }
    } else if (host === 'forcused.github.io') {
      // Accept links pasted from this site:
      // https://forcused.github.io/yt/VIDEO_ID
      // https://forcused.github.io/yt/?v=VIDEO_ID
      if (u.pathname === '/yt/' || u.pathname === '/yt') {
        id = u.searchParams.get('v');
      } else {
        const match = u.pathname.match(/^\/yt\/([A-Za-z0-9_-]{11})\/?$/);
        if (match) id = match[1];
      }
    }
  } catch(e) {}
  return id ? { id, start } : null;
}

function showToast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => $('toast').classList.remove('show'), 2200);
}

$('loadBtn').addEventListener('click', () => loadVideo($('urlInput').value));
$('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadVideo($('urlInput').value); });

function loadVideo(value) {
  const data = extractYouTubeData(value);
  if (!data || !data.id) {
    showToast('Paste a YouTube or ForcusedYT link');
    return;
  }

  currentVideoId = data.id;
  currentTimestamp = data.start;
  document.body.classList.add('playing-video');
  requestDisplayWakeLock();

  // Show the shareable ForcusedYT link in the input after Watch.
  const cleanUrl = new URL('/yt/', location.origin);
  cleanUrl.searchParams.set('v', data.id);
  if (data.start) cleanUrl.searchParams.set('t', data.start);
  $('urlInput').value = cleanUrl.href;
  updateCanonicalUrl(data.id, data.start, true);
  $('statusBadge').textContent = 'Playing';
  $('emptyState').style.display = 'none';

  const iframe = $('videoIframe');

  // Use the normal YouTube embed origin for compatibility with YouTube
  // quality extensions such as ResLock. youtube-nocookie.com is a different
  // origin and may not be matched by an extension that targets YouTube.
  const params = new URLSearchParams();
  params.set('autoplay', '1');
  params.set('rel', '0');
  params.set('playsinline', '1');
params.set('controls', '1');
  params.set('modestbranding', '1');
  params.set('enablejsapi', '1');
  params.set('origin', window.location.origin);

  if (isLooping) {
    params.set('loop', '1');
    params.set('playlist', data.id);
  }
  if (data.start) params.set('start', String(data.start));

  iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(data.id)}?${params.toString()}`;
  iframe.style.display = 'block';

}


// Playback speed overlay: it follows the same mouse-activity rhythm as
// YouTube's native controls, without replacing those controls.
let playbackSpeed = 1;
let speedUiTimer = null;

function sendYouTubeCommand(func, args = []) {
  const iframe = $('videoIframe');
  if (!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), 'https://www.youtube.com');
}

function setPlaybackSpeed(speed) {
  playbackSpeed = Number(speed);
  $('playerSpeedToggle').textContent = playbackSpeed + 'x';
  document.querySelectorAll('.player-speed-option').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.speed) === playbackSpeed);
  });
  sendYouTubeCommand('setPlaybackRate', [playbackSpeed]);
  showToast(`Playback speed: ${playbackSpeed}x`);
  $('playerSpeed').classList.remove('speed-open');
  $('playerSpeedToggle').setAttribute('aria-expanded', 'false');
  showSpeedUi();
}

function showSpeedUi() {
  const aspect = $('playerAspect');
  if (!aspect || $('videoIframe').style.display === 'none') return;
  aspect.classList.add('speed-ui-visible');
  clearTimeout(speedUiTimer);
  speedUiTimer = setTimeout(() => {
    if (!$('playerSpeed').matches(':hover')) {
      aspect.classList.remove('speed-ui-visible');
      $('playerSpeed').classList.remove('speed-open');
      $('playerSpeedToggle').setAttribute('aria-expanded', 'false');
    }
  }, 5000);
}

$('playerAspect').addEventListener('mousemove', showSpeedUi);
$('playerAspect').addEventListener('mouseenter', showSpeedUi);
document.addEventListener('mousemove', e => {
  const aspect = $('playerAspect');
  if (!aspect || $('videoIframe').style.display === 'none') return;
  const rect = aspect.getBoundingClientRect();
  if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
    showSpeedUi();
  }
});
$('playerAspect').addEventListener('mouseleave', () => {
  clearTimeout(speedUiTimer);
  $('playerSpeed').classList.remove('speed-open');
  $('playerSpeedToggle').setAttribute('aria-expanded', 'false');
  $('playerAspect').classList.remove('speed-ui-visible');
});

$('playerSpeedToggle').addEventListener('click', e => {
  e.stopPropagation();
  showSpeedUi();
  const open = $('playerSpeed').classList.toggle('speed-open');
  $('playerSpeedToggle').setAttribute('aria-expanded', String(open));
});

document.querySelectorAll('.player-speed-option').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    setPlaybackSpeed(btn.dataset.speed);
  });
});

const FORCUSED_USERSCRIPT = "// ==UserScript==\n// @name           ForcusedYT Auto-Redirect\n// @namespace      forcused.github.io\n// @description    Auto-redirect YouTube videos to ForcusedYT.\n// @match          http://*/*\n// @match          https://*/*\n// @noframes\n// @grant          GM_setValue\n// @grant          GM_getValue\n// @grant          GM_registerMenuCommand\n// @version        1.0\n// @icon           https://www.youtube.com/s/desktop/fe1d1f42/img/favicon_32x32.png\n// ==/UserScript==\n\n(function () {\n  'use strict';\n\n  const FORCUSED_HOST = 'forcused.github.io';\n  const FORCUSED_PATH = '/yt/';\n\n  // Don't redirect our own site.\n  if (\n    location.hostname === FORCUSED_HOST &&\n    location.pathname.startsWith(FORCUSED_PATH)\n  ) {\n    return;\n  }\n\n  let redirectSearches = GM_getValue('redirectSearches', false);\n\n  GM_registerMenuCommand(\n    'Toggle YouTube search redirects',\n    function () {\n      redirectSearches = !redirectSearches;\n      GM_setValue('redirectSearches', redirectSearches);\n    }\n  );\n\n  // Extract a YouTube video ID.\n  function getYouTubeId(raw) {\n    let u;\n\n    try {\n      u = new URL(raw, location.href);\n    } catch (_) {\n      return null;\n    }\n\n    const host = u.hostname.replace(/^www\\./, '');\n\n    if (\n      ![\n        'youtube.com',\n        'm.youtube.com',\n        'music.youtube.com',\n        'youtu.be'\n      ].includes(host)\n    ) {\n      return null;\n    }\n\n    let id = '';\n\n    // youtu.be/VIDEO_ID\n    if (host === 'youtu.be') {\n      id = u.pathname.split('/')[1] || '';\n    }\n\n    // youtube.com/watch?v=VIDEO_ID\n    if (!id) {\n      id = u.searchParams.get('v') || '';\n    }\n\n    // youtube.com/shorts/VIDEO_ID\n    // youtube.com/live/VIDEO_ID\n    // youtube.com/embed/VIDEO_ID\n    if (!id) {\n      const match = u.pathname.match(\n        /^\\/(shorts|live|embed)\\/([A-Za-z0-9_-]{11})/\n      );\n\n      if (match) {\n        id = match[2];\n      }\n    }\n\n    return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;\n  }\n\n  // Build your reliable GitHub Pages URL.\n  function destination(raw) {\n    const id = getYouTubeId(raw);\n\n    if (!id) {\n      return null;\n    }\n\n    return (\n      'https://' +\n      FORCUSED_HOST +\n      FORCUSED_PATH +\n      '?v=' +\n      encodeURIComponent(id)\n    );\n  }\n\n  // Redirect the current page if it is a YouTube video.\n  function redirect() {\n    const target = destination(location.href);\n\n    if (target) {\n      location.replace(target);\n      return;\n    }\n\n    // Optional YouTube search redirect.\n    if (\n      redirectSearches &&\n      /^(www\\.|m\\.)?youtube\\.com$/.test(location.hostname) &&\n      location.pathname === '/results' &&\n      new URL(location.href).searchParams.has('search_query')\n    ) {\n      const query = new URL(location.href)\n        .searchParams\n        .get('search_query');\n\n      if (query) {\n        // Search stays on YouTube because ForcusedYT is a video player.\n        // This section intentionally does not redirect the search.\n      }\n    }\n  }\n\n  // Convert YouTube links already visible on a page.\n  function convertLinks() {\n    document.querySelectorAll('a[href]').forEach(function (link) {\n      const target = destination(link.href);\n\n      if (target) {\n        link.href = target;\n      }\n    });\n  }\n\n  // Initial run.\n  redirect();\n  convertLinks();\n\n  // YouTube SPA navigation.\n  document.addEventListener(\n    'yt-navigate-finish',\n    function () {\n      redirect();\n      convertLinks();\n    }\n  );\n\n  // Browser back/forward.\n  window.addEventListener('popstate', function () {\n    redirect();\n    convertLinks();\n  });\n\n  // YouTube dynamically creates links as you scroll.\n  let queued = false;\n  let current = location.href;\n\n  new MutationObserver(function () {\n    if (queued) return;\n\n    queued = true;\n\n    setTimeout(function () {\n      queued = false;\n\n      if (current !== location.href) {\n        current = location.href;\n        redirect();\n      }\n\n      convertLinks();\n    }, 200);\n  }).observe(document.documentElement, {\n    childList: true,\n    subtree: true\n  });\n\n})();";
$('userscriptCode').value = FORCUSED_USERSCRIPT;
$('userscriptBtn').onclick = () => {
  $('userscriptModal').classList.add('show');
  $('userscriptModal').setAttribute('aria-hidden', 'false');
};
function closeUserscript() {
  $('userscriptModal').classList.remove('show');
  $('userscriptModal').setAttribute('aria-hidden', 'true');
}
$('userscriptClose').onclick = closeUserscript;
$('userscriptDone').onclick = closeUserscript;
$('userscriptBackdrop').onclick = closeUserscript;
$('userscriptCopy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(FORCUSED_USERSCRIPT);
    showToast('Userscript copied');
  } catch (e) {
    $('userscriptCode').focus();
    $('userscriptCode').select();
    showToast('Select the code and copy');
  }
};

// Load /yt/?v=VIDEO_ID automatically on first visit and after reload.
const deepLink = getDeepLinkData();
if (deepLink) {
  loadVideo(deepLink.id + (deepLink.start ? '?t=' + deepLink.start : ''));
}

// Browser back/forward support.
window.addEventListener('popstate', () => {
  const data = getDeepLinkData();
  if (data) {
    loadVideo(data.id + (data.start ? '?t=' + data.start : ''));
  }
});

function toggleFullScreen() {
  const container = $('playerContainer');
  if (!document.fullscreenElement) {
    const request = container.requestFullscreen || container.webkitRequestFullscreen;
    if (request) {
      Promise.resolve(request.call(container)).catch(() => showToast('Fullscreen unavailable'));
    } else {
      showToast('Fullscreen unavailable');
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) Promise.resolve(exit.call(document)).catch(() => {});
  }
}

function updateFullscreenButton() {
  const active = !!document.fullscreenElement;
  $('fullscreenBtn').classList.toggle('active', active);
  $('fullscreenBtn').lastChild.textContent = active ? ' Exit Fullscreen' : ' Fullscreen';
}

function toggleFocusMode() {
  const active = document.body.classList.toggle('focus-mode');
  $('focusBtn').classList.toggle('active', active);
  $('focusBtn').lastChild.textContent = active ? ' Exit Focus' : ' Focus Mode';
  showToast(active ? 'Focus Mode On — press F or Esc to exit' : 'Focus Mode Off');
}

$('focusBtn').onclick = toggleFocusMode;
$('focusExitBtn').onclick = () => { if (document.body.classList.contains('focus-mode')) toggleFocusMode(); };
$('fullscreenBtn').onclick = toggleFullScreen;
document.addEventListener('fullscreenchange', updateFullscreenButton);
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'f' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) {
    e.preventDefault();
    toggleFocusMode();
  }
  if (e.key === '`') {
    e.preventDefault();
    toggleFullScreen();
  }
  if (e.key === 'Escape' && $('userscriptModal').classList.contains('show')) {
    closeUserscript();
    return;
  }
  if (e.key === 'Escape' && document.body.classList.contains('focus-mode') && !document.fullscreenElement) {
    toggleFocusMode();
  }
});
</script>
